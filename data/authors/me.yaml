bio: |
  Kyhl Austin is a museum entomologist and systematist specializing in
  Lepidoptera, and a Ph.D. candidate in the Rubinoff Lab at the University
  of Hawaiʻi at Mānoa. His research integrates morphology, phylogenetics, and
  genomics to document, classify, and conserve Hawaiian and Pacific moths.
  He has described seven new genera and 36 new species of native Hawaiian
  Lepidoptera and developed diagnostic tools for invasive and agricultural
  pest species. Kyhl has curated major insect collections at the University
  of Hawaiʻi, Cornell University, and the Mississippi Entomological Museum,
  and is committed to public engagement and the long-term stewardship of
  natural history collections.

